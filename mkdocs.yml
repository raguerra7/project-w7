site_name: W7
site_description: The source of truth for the W7 ecosystem.
site_url: https://raguerra7.github.io/project-w7/
repo_url: https://github.com/raguerra7/project-w7
repo_name: raguerra7/project-w7
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  logo: assets/brand/w7-symbol.svg
  favicon: assets/brand/favicon.svg
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.top
    - content.action.edit
    - toc.follow

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: pt
          name: Português
          build: true
          nav_translations:
            Home: Início
            Foundations: Fundamentos
            Constitution: Constituição
            Mission: Missão
            Values: Valores
            Principles of Building: Princípios de Construção
            Operating Model: Modelo Operacional
            Manifesto: Manifesto
            Vision: Visão
            Legacy: Legado
            Identity: Identidade
            Brand Architecture: Arquitetura de Marca
            Logo System: Sistema de Logo
            Color System: Sistema de Cores
            Typography: Tipografia
            Voice and Tone: Voz e Tom
            Visual Language: Linguagem Visual
            Architecture: Arquitetura
            Overview: Visão Geral
            Topology: Topologias
            Knowledge Architecture: Arquitetura do Conhecimento
            Technology Stack: Stack de Tecnologia
            Framework: Framework
            Governance: Governança
            Decision Framework: Framework de Decisão
            Initiative Framework: Framework de Iniciativas
            Product Framework: Framework de Produtos
            Initiatives: Iniciativas
            Registry: Registro
            Standards: Padrões
            Documentation Standard: Padrão de Documentação
            Engineering Standard: Padrão de Engenharia
            GitHub Standard: Padrão do GitHub
            AI Usage Standard: Padrão de Uso de IA
            Information Boundaries: Limites de Informação
            Roadmap: Roadmap
            Founder: Fundador
            Founder's Letter: Carta do Fundador
            Origin Story: História de Origem

markdown_extensions:
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

extra_css:
  - assets/stylesheets/visuals.css

extra_javascript:
  - assets/javascripts/diagram-zoom.js

nav:
  - Home: index.md
  - Foundations:
      - Constitution: foundations/constitution.md
      - Mission: foundations/mission.md
      - Values: foundations/values.md
      - Principles of Building: foundations/principles-of-building.md
      - Operating Model: foundations/operating-model.md
      - Manifesto: foundations/manifesto.md
      - Vision: foundations/vision.md
      - Legacy: foundations/legacy.md
  - Identity:
      - Brand Architecture: identity/brand-architecture.md
      - Logo System: identity/logo-system.md
      - Color System: identity/color-system.md
      - Typography: identity/typography.md
      - Voice and Tone: identity/voice-and-tone.md
      - Visual Language: identity/visual-language.md
  - Architecture:
      - Overview: architecture/overview.md
      - Topology: architecture/topology.md
      - Knowledge Architecture: architecture/knowledge-architecture.md
      - Technology Stack: architecture/technology-stack.md
  - Framework:
      - Governance: framework/governance.md
      - Decision Framework: framework/decision-framework.md
      - Initiative Framework: framework/initiative-framework.md
      - Product Framework: framework/product-framework.md
  - Initiatives:
      - Registry: initiatives/README.md
      - WarTips: initiatives/wartips/README.md
  - Standards:
      - Documentation Standard: standards/documentation-standard.md
      - Engineering Standard: standards/engineering-standard.md
      - GitHub Standard: standards/github-standard.md
      - AI Usage Standard: standards/ai-usage-standard.md
      - Information Boundaries: standards/information-boundaries.md
  - ADR:
      - Template: adr/template.md
      - "ADR-0001 GitHub as Source of Truth": adr/0001-github-as-source-of-truth.md
      - "ADR-0002 Layered Repository Architecture": adr/0002-layered-repository-architecture.md
      - "ADR-0003 Initiative Governance Model": adr/0003-initiative-governance-model.md
      - "ADR-0004 Activate Foundation Documents": adr/0004-activate-foundation-documents.md
      - "ADR-0005 Activate Endorsed Brand Architecture": adr/0005-activate-endorsed-brand-architecture.md
      - "ADR-0006 Activate Governance and Frameworks": adr/0006-activate-governance-and-frameworks.md
      - "ADR-0007 Activate Ecosystem Architecture": adr/0007-activate-ecosystem-architecture.md
      - "ADR-0008 Activate Shared Standards": adr/0008-activate-shared-standards.md
      - "ADR-0009 Complete Foundation v1.0": adr/0009-complete-foundation-v1.md
      - "ADR-0010 Adopt Production Identity Assets": adr/0010-adopt-w7-production-identity-assets.md
  - Roadmap: roadmap/roadmap.md
  - Founder:
      - Overview: founder/README.md
      - Founder's Letter: founder/founder-letter.md
      - Origin Story: founder/origin-story.md
